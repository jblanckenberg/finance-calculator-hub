<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#1B3A5C">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compound Interest Calculator (Embed) | FinCalcHub</title>
  <meta name="description" content="Embedded compound interest calculator widget by FinCalcHub.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://finncalc.com/compound-interest/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/finncalc.svg" type="image/svg+xml">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-700.woff2" crossorigin>
  <style>
    /* Embed-only overrides: the chrome-less page has no sticky header so
       reset the body padding the main stylesheet bakes in for the header. */
    body { padding: 0; }
    .container { padding: 12px 16px; max-width: 100%; }
    .embed-credit {
      margin: 12px 16px 8px;
      font-size: 11px;
      color: #6B7280;
      text-align: right;
    }
    .embed-credit a { color: #1E88E5; text-decoration: none; }
  </style>
  <script defer data-domain="embed.finncalc.com" src="https://plausible.io/js/script.js"></script>
  <link rel="preconnect" href="https://finncalc.com" crossorigin>
  <link rel="preload" as="style" href="/css/main.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="/css/main.css"></noscript>
</head>
<body>

<!-- Region Bar (inside body, above the calculator) -->
<div class="region-wrap" style="position:relative;top:0">
  <div class="region-bar">
    <button class="region-btn active" id="btn-USA" onclick="setRegion('USA')"><img src="/img/flags/us.svg" alt="" width="24" height="16" class="flag"> USA</button>
    <button class="region-btn" id="btn-UK"  onclick="setRegion('UK')"><img src="/img/flags/gb.svg" alt="" width="24" height="16" class="flag"> United Kingdom</button>
    <button class="region-btn" id="btn-SA"  onclick="setRegion('SA')"><img src="/img/flags/za.svg" alt="" width="24" height="16" class="flag"> South Africa</button>
  </div>
</div>

<div class="container">
  <h1 style="font-size:20px;margin-bottom:8px">Compound Interest Calculator</h1>

  <div class="card">
    <div class="card-title">Enter Your Details</div>
    <div class="form-row">
      <div class="form-group">
        <label for="principal">Starting Amount <span class="hint" id="currency-label">($)</span></label>
        <input type="number" id="principal" value="1000" min="0" oninput="calculate()" inputmode="decimal">
      </div>
      <div class="form-group">
        <label for="rate">Annual Interest Rate (%)</label>
        <input type="number" id="rate" value="7" min="0" max="100" step="0.1" oninput="calculate()" inputmode="decimal">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="years">Number of Years</label>
        <input type="number" id="years" value="10" min="1" max="50" oninput="calculate()" inputmode="decimal">
      </div>
      <div class="form-group">
        <label for="frequency">Compounding Frequency</label>
        <select id="frequency" onchange="calculate()">
          <option value="1">Yearly</option>
          <option value="4">Quarterly</option>
          <option value="12" selected>Monthly</option>
          <option value="365">Daily</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="monthly">Monthly Contribution <span class="hint" id="contrib-label">(optional, $)</span></label>
      <input type="number" id="monthly" value="100" min="0" oninput="calculate()" inputmode="decimal">
    </div>
    <button class="btn-calc" onclick="calculate()">Calculate &rarr;</button>
  </div>

  <div class="results" id="results" role="region" aria-live="polite" aria-atomic="true" aria-label="Calculator result">
    <div class="results-title">Your Results</div>
    <div class="result-grid">
      <div class="result-item">
        <div class="result-value positive" id="r-final">$0</div>
        <div class="result-label">Final Balance</div>
      </div>
      <div class="result-item">
        <div class="result-value" id="r-interest">$0</div>
        <div class="result-label">Interest Earned</div>
      </div>
      <div class="result-item">
        <div class="result-value" id="r-contrib">$0</div>
        <div class="result-label">Total Contributed</div>
      </div>
      <div class="result-item">
        <div class="result-value" id="r-ear">0%</div>
        <div class="result-label">Effective Annual Rate</div>
      </div>
    </div>
  </div>
</div>

<p class="embed-credit">
  Open the full calculator at
  <a href="https://finncalc.com/compound-interest/?utm_source=embed&amp;utm_medium=widget&amp;utm_campaign=compound-interest" target="_blank" rel="noopener">FinCalcHub</a>.
</p>

<script src="/js/region.js" defer></script>
<script src="/js/main.js" defer></script>
<script>
  var origSetRegion = setRegion;
  setRegion = function(region) {
    origSetRegion(region);
    var symbols = { USA: '$', UK: '£', SA: 'R' };
    var sym = symbols[region] || '$';
    var cl = document.getElementById('currency-label');
    var ml = document.getElementById('contrib-label');
    if (cl) cl.textContent = '(' + sym + ')';
    if (ml) ml.textContent = '(optional, ' + sym + ')';
    if (document.getElementById('results').classList.contains('show')) calculate();
  };

  function calculate() {
    var P   = parseFloat(document.getElementById('principal').value) || 0;
    var r   = parseFloat(document.getElementById('rate').value)      || 0;
    var t   = parseFloat(document.getElementById('years').value)     || 1;
    var n   = parseFloat(document.getElementById('frequency').value) || 12;
    var pmt = parseFloat(document.getElementById('monthly').value)   || 0;
    r = r / 100;
    var ratePerPeriod = r / n;
    var totalPeriods  = n * t;
    var A;
    if (ratePerPeriod === 0) {
      A = P + pmt * 12 * t;
    } else {
      var growth = Math.pow(1 + ratePerPeriod, totalPeriods);
      A = P * growth + pmt * (12 / n) * ((growth - 1) / ratePerPeriod);
    }
    var totalContrib = P + pmt * 12 * t;
    var totalInterest = A - totalContrib;
    var ear = Math.pow(1 + ratePerPeriod, n) - 1;
    document.getElementById('r-final').textContent    = formatMoney(A);
    document.getElementById('r-interest').textContent = formatMoney(totalInterest);
    document.getElementById('r-contrib').textContent  = formatMoney(totalContrib);
    document.getElementById('r-ear').textContent      = (ear * 100).toFixed(2) + '%';
    document.getElementById('results').classList.add('show');
  }
  document.addEventListener('DOMContentLoaded', function() { calculate(); });
</script>
<script src="/js/embed-resizer.js" defer></script>
</body>
</html>
