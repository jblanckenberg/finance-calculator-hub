<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="finncalc logo">
  <title>finncalc</title>
  <!-- Sister-brand glyph: growth chart -->
  <g>
    <rect x="20" y="30" width="100" height="100" rx="16" ry="16" fill="#FFFFFF" stroke="#203A5F" stroke-width="6"/>
    <!-- Baseline -->
    <line x1="34" y1="118" x2="106" y2="118" stroke="#203A5F" stroke-width="3" stroke-linecap="round"/>
    <!-- Ascending bars -->
    <rect x="38" y="95"  width="14" height="22" rx="2" ry="2" fill="#203A5F"/>
    <rect x="58" y="80"  width="14" height="37" rx="2" ry="2" fill="#203A5F"/>
    <rect x="78" y="62"  width="14" height="55" rx="2" ry="2" fill="#14B8A6"/>
    <!-- Trend arrow -->
    <polyline points="42,88 64,72 84,56 100,46"
              fill="none" stroke="#14B8A6" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="100,46 92,44 96,54" fill="#14B8A6"/>
  </g>
  <!-- Wordmark -->
  <text x="150" y="103"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.8">
    <tspan fill="#14B8A6">finn</tspan><tspan fill="#203A5F">calc</tspan>
  </text>
</svg>
