name: Lighthouse

on:
  workflow_dispatch:
  schedule:
    # Weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lighthouse audit (production URLs)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://finncalc.com/
            https://finncalc.com/personal-finance-calculators/
            https://finncalc.com/compound-interest/
            https://finncalc.com/mortgage/
            https://finncalc.com/take-home-pay/
            https://finncalc.com/stamp-duty-calculator/
            https://finncalc.com/take-home-pay-comparison/
            https://finncalc.com/sa-tax-calculator/
            https://finncalc.com/glossary/
            https://finncalc.com/blog/
            https://finncalc.com/blog/compound-interest-explained/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouse/lighthouserc.json
